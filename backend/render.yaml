services:
  - type: web
    name: finanzas-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finanzas-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: "https://fedetourn.github.io"

databases:
  - name: finanzas-db
    plan: free
